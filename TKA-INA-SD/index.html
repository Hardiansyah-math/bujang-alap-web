const CFG={mapel:"Bahasa Indonesia",dur:75,dm:["Tekstual (menemukan informasi)","Inferensial (memahami yang tersirat)","Evaluasi dan apresiasi"],info:"Baca setiap teks dengan teliti. Jawablah berdasarkan isi teks, bukan pendapat sendiri."};
const DATA={S:[
{j:"Teks 1: Sampah Plastik di Laut",x:"Setiap tahun, jutaan ton sampah plastik berakhir di laut. Plastik tidak membusuk seperti daun atau kulit buah. Ia hanya pecah menjadi serpihan sangat kecil yang disebut mikroplastik. Serpihan ini sering dikira makanan oleh ikan, penyu, dan burung laut. Akibatnya, perut hewan-hewan itu penuh plastik sehingga mereka sakit dan bahkan mati. Mikroplastik juga dapat sampai ke tubuh manusia melalui ikan yang kita makan.\n\nPara peneliti memperkirakan sebuah botol plastik baru terurai setelah sekitar 450 tahun. Karena itu, pemakaian plastik sekali pakai perlu dikurangi. Membawa botol minum sendiri dan memakai tas belanja dari kain adalah langkah kecil yang bisa dilakukan siapa saja. Jika dilakukan bersama-sama, langkah kecil itu akan membantu laut tetap bersih dan makhluk hidup di dalamnya tetap sehat."},
{j:"Teks 2: Sepeda Baru Raka",x:"Raka sangat ingin memiliki sepeda baru. Setiap hari ia menyisihkan sebagian uang jajannya ke dalam celengan ayam. Teman-temannya sering mengajaknya jajan, tetapi Raka hanya menggeleng sambil tersenyum.\n\nSuatu hari celengan itu dibuka. Uang di dalamnya ternyata belum cukup untuk membeli sepeda. Raka murung sepanjang sore. Ayah yang melihatnya lalu berkata, “Tabunganmu sudah banyak, Nak. Kekurangannya biar Ayah yang menambah.” Mata Raka berbinar-binar.\n\nSorenya, mereka membeli sepeda itu di toko. Dalam perjalanan pulang, Raka melihat Dino, teman sekelasnya, sedang menuntun sepeda yang rantainya putus. Raka segera turun dan membantu Dino memasang rantai itu hingga sepedanya dapat dipakai lagi. Dino mengucapkan terima kasih berkali-kali. Raka pun pulang dengan hati bahagia."},
{j:"Teks 3: Pentingnya Sarapan",x:"Banyak anak melewatkan sarapan karena terburu-buru berangkat sekolah. Padahal, sarapan sangat penting. Setelah tidur semalaman, tubuh kehabisan tenaga. Sarapan memberi energi agar otak dapat berpikir dengan baik. Anak yang sarapan biasanya lebih mudah berkonsentrasi saat belajar.\n\nSarapan tidak harus mahal atau rumit. Menu yang baik mengandung karbohidrat, protein, serta sayur atau buah. Nasi dengan telur dan sayur bayam adalah salah satu contohnya. Menurut saya, sarapan paling enak dimakan bersama keluarga. Sebaliknya, minum minuman manis saja di pagi hari kurang baik karena perut cepat lapar lagi. Para dokter menganjurkan sarapan dilakukan sebelum pukul tujuh agar tubuh siap beraktivitas."},
{j:"Teks 4: Semut dan Merpati",x:"Di tepi sungai, seekor semut kehausan lalu turun ke air. Tiba-tiba arus membawanya hanyut. Semut berteriak minta tolong. Seekor merpati yang bertengger di dahan melihatnya dan segera menjatuhkan selembar daun ke air. Semut naik ke atas daun itu dan terbawa sampai ke tepi.\n\n“Terima kasih, Merpati. Kau telah menyelamatkan nyawaku,” kata Semut.\n\nBeberapa hari kemudian, seorang pemburu mengintai merpati itu sambil membawa jaring. Semut melihatnya dari bawah pohon. Cepat-cepat ia menggigit kaki pemburu itu. Pemburu menjerit kesakitan dan jaringnya terjatuh. Merpati terkejut lalu terbang menjauh. Ia selamat berkat kebaikan sahabat kecilnya."},
{j:"Teks 5: Hutan Mangrove",x:"Hutan mangrove tumbuh di pantai atau muara sungai yang airnya asin. Akar pohon mangrove menjuntai dan saling mengait dengan kuat. Akar ini menahan ombak sehingga pantai tidak mudah terkikis. Tanpa mangrove, ombak akan mengikis daratan sedikit demi sedikit. Peristiwa ini disebut abrasi. Saat badai datang, hutan mangrove juga dapat mengurangi kekuatan gelombang.\n\nAkar mangrove menjadi tempat berlindung dan bertelur bagi ikan, udang, dan kepiting. Karena itu, nelayan di sekitar hutan mangrove biasanya mudah mendapat hasil tangkapan. Sayangnya, banyak hutan mangrove ditebang untuk dijadikan tambak dan permukiman. Kini pemerintah dan warga mulai menanam kembali bibit mangrove di berbagai pantai."},
{j:"Teks 6: Puisi “Hujan Pertama”",x:"Awan kelabu berkumpul di langit,\nangin berbisik membawa kabar.\nTetes pertama jatuh di genting,\ntik, tik, tik, seperti musik pelan.\nTanah kering tersenyum lega,\ndaun-daun mandi dengan riang.\nAku berdiri di balik jendela,\nmenunggu pelangi datang bertandang.\nTerima kasih, hujan,\nkarena kamu, kebun nenek akan hijau lagi."}],

{s:2,t:"k",d:0,q:"Tentukan Benar atau Salah setiap pernyataan berikut berdasarkan teks.",st:[["Anak yang sarapan biasanya lebih mudah berkonsentrasi.",1],["Minuman manis saja sudah cukup sebagai sarapan.",0],["Dokter menganjurkan sarapan sebelum pukul tujuh.",1],["Teks menyarankan melewatkan sarapan jika terburu-buru.",0]]},
{s:2,t:"s",d:2,q:"Tujuan penulis menulis teks tersebut adalah …",o:["menceritakan pengalaman pribadi saat sarapan","mengajak pembaca membeli minuman manis","mengajak pembaca membiasakan sarapan setiap pagi","menjelaskan cara memasak nasi dan telur"],a:2},

{s:3,t:"s",d:1,q:"Urutan peristiwa yang benar dalam cerita adalah …",o:["Semut hanyut → merpati menjatuhkan daun → pemburu mengintai → semut menggigit pemburu","Pemburu mengintai → semut hanyut → merpati menjatuhkan daun → semut menggigit pemburu","Merpati menjatuhkan daun → pemburu mengintai → semut hanyut → semut menggigit pemburu","Semut menggigit pemburu → semut hanyut → merpati menjatuhkan daun → pemburu mengintai"],a:0},

const txt=(q,a)=>a==null||(Array.isArray(a)&&!a.some(x=>x!=null))?"Tidak dijawab":q.t=="s"?L[a]+". "+q.o[a]:q.t=="m"?[...a].sort().map(i=>L[i]+". "+q.o[i]).join("; "):q.st.map((x,j)=>(j+1)+". "+(a[j]==null?"-":(q.l||LB)[a[j]])).join(", ");
function home(){$("app").innerHTML=`<main class="wrap hero"><div class="cd"><h1>CBT Tryout TKA Bahasa Indonesia SD</h1><h2>Simulasi TKA SD 2027, Kelas 6</h2><p>${CFG.info}</p><ul><li>${N} soal dengan waktu ${CFG.dur} menit.</li><li>Pilihan ganda biasa: pilih satu jawaban.</li><li>Pilihan ganda kompleks: pilih semua jawaban yang benar.</li><li>Kategori: tentukan Benar/Salah atau Sesuai/Tidak sesuai untuk setiap pernyataan.</li><li>Soal kompleks dan kategori dinilai benar jika semua pilihannya tepat.</li></ul><label for="nm">Nama peserta</label><input id="nm" autocomplete="name"><button class="pr" onclick="go()">Mulai ujian</button><p style="margin:16px 0 0;color:var(--mu);font-size:.9rem">Pengembang: Hardiansyah</p></div></main>`}
function go(){nm=$("nm").value.trim()||"Peserta";$("app").innerHTML=`<header><div><b>CBT Tryout TKA Bahasa Indonesia SD</b><small>${esc(nm)}</small></div><div id="tm" class="tm">${fmt()}</div></header><main id="mn" class="wrap"></main>`;tm=setInterval(()=>{left--;$("tm").textContent=fmt();$("tm").className="tm"+(left<300?" lo":"");if(left<=0)finish()},1000);show()}
const chart=c=>{const m=Math.max(...c[1]);return`<div class="ch">${c[1].map(v=>`<div class="cb"><b>${v}</b><i style="height:${v/m*150}px"></i></div>`).join("")}</div><div class="cl">${c[0].map(l=>`<span>${l}</span>`).join("")}</div>`};
const tbl=t=>`<table><tr>${t[0].map(h=>`<th>${h}</th>`).join("")}</tr>${t[1].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
const stim=s=>`<div class="cd st">${s.j?`<h3>${s.j}</h3>`:""}${s.x?`<p>${fx(s.x)}</p>`:""}${s.ch?chart(s.ch):""}${s.tb?tbl(s.tb):""}</div>`;
const nav=()=>`<div class="ng">${Q.map((_,i)=>`<button class="nb${i==cur?" cu":""}${has(i)?" on":""}${fl[i]?" fg":""}" onclick="jump(${i})" aria-label="Soal ${i+1}">${i+1}</button>`).join("")}</div><p class="lg">Warna penuh: sudah dijawab. Tanda ?: ragu-ragu.</p><button class="pr w" onclick="ask()">Selesai ujian</button>`;
function show(){const q=Q[cur],s=q.s!=null?S[q.s]:null,lb=q.l||LB;
const hint={s:"Pilih satu jawaban.",m:"Pilih semua jawaban yang benar.",k:"Tentukan pilihan untuk setiap pernyataan."}[q.t];let o="";
if(q.t=="s")o=q.o.map((x,i)=>`<button class="op${ans[cur]===i?" s":""}" onclick="pick(${i})"><b>${L[i]}</b><span>${fx(x)}</span></button>`).join("");
else if(q.t=="m")o=q.o.map((x,i)=>`<button class="op m${has(cur)&&ans[cur].includes(i)?" s":""}" onclick="pick(${i})"><b>${L[i]}</b><span>${fx(x)}</span></button>`).join("");
else o=q.st.map((x,j)=>`<div class="kr"><div class="kt">${j+1}. ${fx(x[0])}</div>${lb.map((b,v)=>`<button class="kb${ans[cur]&&ans[cur][j]===v?" s":""}" onclick="pick(${j},${v})">${b}</button>`).join("")}</div>`).join("");
$("mn").innerHTML=`<div class="g"><div>${s?stim(s):""}<div class="cd"><p class="nq">Soal ${cur+1} dari ${N}</p><p class="q">${fx(q.q)}</p><p class="hint">${hint}</p>${o}</div><div class="ct"><button class="sc2" onclick="mv(-1)" ${cur?"":"disabled"}>Sebelumnya</button><button class="sc2" onclick="flag()">${fl[cur]?"Batalkan ragu-ragu":"Ragu-ragu"}</button>${cur<N-1?`<button class="pr" onclick="mv(1)">Berikutnya</button>`:`<button class="pr" onclick="ask()">Selesai</button>`}</div></div><aside class="cd">${nav()}</aside></div>`}
function pick(a,b){const q=Q[cur];if(q.t=="s")ans[cur]=a;else{const r=ans[cur]||[];if(q.t=="m"){const k=r.indexOf(a);k<0?r.push(a):r.splice(k,1)}else r[a]=b;ans[cur]=r}show()}
const jump=i=>{cur=i;show();scrollTo(0,0)},mv=d=>jump(Math.min(N-1,Math.max(0,cur+d))),flag=()=>{fl[cur]=!fl[cur];show()};
function ask(){const a=Q.filter((_,i)=>has(i)).length,f=Object.values(fl).filter(Boolean).length;scrollTo(0,0);$("mn").innerHTML=`<div class="cd hero"><h2>Kumpulkan jawaban?</h2><p>Terjawab ${a} dari ${N} soal. Ragu-ragu: ${f} soal. Belum dijawab: ${N-a} soal.</p><div class="ct"><button class="pr" onclick="finish()">Kumpulkan sekarang</button><button class="sc2" onclick="show()">Kembali ke soal</button></div></div>`}
function finish(){clearInterval(tm);const r=Q.map((_,i)=>right(i)),n=r.filter(Boolean).length;$("tm").textContent="Selesai";scrollTo(0,0);
const bd=CFG.dm.map((d,k)=>{const ix=Q.map((_,i)=>i).filter(i=>Q[i].d==k);return`<div class="bd"><span>${d}</span><span>${ix.filter(i=>r[i]).length} dari ${ix.length} benar</span></div><div class="pb"><i style="width:${ix.filter(i=>r[i]).length/ix.length*100}%"></i></div>`}).join("");
$("mn").innerHTML=`<div class="cd hero"><p>${esc(nm)}</p><div class="big">${Math.round(n/N*100)}</div><p>Nilai dari 100. Benar ${n} dari ${N} soal.</p>${bd}<div class="ct" style="margin-top:14px"><button class="pr" onclick="location.reload()">Ulangi ujian</button></div><p style="margin:14px 0 0;color:var(--mu);font-size:.9rem">Pengembang: Hardiansyah</p></div><h2>Kunci dan jawabanmu</h2>`+Q.map((q,i)=>`<details class="cd rv"><summary class="${r[i]?"ok":"no"}">Soal ${i+1}: ${r[i]?"benar":"salah"}</summary>${q.s!=null&&S[q.s].j?`<p><small>${S[q.s].j}</small></p>`:""}<p>${fx(q.q)}</p><p><b>Jawabanmu:</b> ${fx(txt(q,ans[i]))}</p><p><b>Kunci:</b> ${fx(txt(q,key(q)))}</p></details>`).join("")}
home();
</script></body></html>
